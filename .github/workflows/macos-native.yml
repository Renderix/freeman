name: Build Freeman macOS JAR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Build KMP JVM fat JAR
        # Uses the repo's Gradle wrapper; output always visible
        run: ./gradlew :macos:macosJar 2>&1 | tail -10

      - name: Verify JAR exists
        # Step ID: verify-jar
        id: verify-jar
        run: |
          JAR="macos/build/libs/macos-macos.jar"
          if [ -f "$JAR" ]; then
            echo "JAR found at: $JAR"
            echo "upload=true" >> $GITHUB_OUTPUT
          else
            echo "JAR not found at $JAR"
            echo "upload=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        if: steps.verify-jar.outputs.upload == 'true'
        with:
          name: freeman-macos-jar
          path: macos/build/libs/macos-macos.jar

      - name: Build complete
        if: always()
        run: |
          echo "=== Freeman macOS JAR Build ==="
          if [ "${{ steps.verify-jar.outputs.upload }}" = "true" ]; then
            echo "JAR uploaded successfully: freeman-macos-jar artifact"
            echo "Download from: Actions → Artifacts sidebar"
          else
            echo "JAR not found — check build log above for errors"
          fi
          echo ""
          echo "To run Freeman locally:"
          echo "  java -Djava.library.path=macos/libs -jar macos/build/libs/macos-macos.jar config.yaml"
          echo ""
          echo "To build native binary:"
          echo "  1. Install GraalVM CE 22.3.0"
          echo "  2. ./gradlew :macos:macosNativeImage"
          echo "  3. ./freeman-native config.yaml (no -Djava.library.path needed)"