name: Build Freeman macOS JAR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Install Gradle if needed
        # Use the Gradle wrapper that's already in the repo
        # The gradle wrapper files (gradlew, gradle.properties) are version-controlled
        run: |
          chmod +x gradlew
          ./gradlew --version 2>&1 | head -3

      - name: Build KMP JVM fat JAR
        # Use the local Gradle wrapper - no external action needed
        run: ./gradlew :macos:macosJar 2>&1 | tail -10

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: freeman-macos-jar
          path: macos/build/libs/macos-macos.jar

      - name: Build complete
        if: always()
        run: |
          echo "=== Build finished ==="
          echo "JAR: macos/build/libs/macos-macos.jar (uploaded as freeman-macos-jar artifact)"
          echo ""
          echo "To build native binary on local machine:"
          echo "  1. Install GraalVM CE 22.3.0: https://www.graalvm.org/downloads/"
          echo "  2. Run: ./gradlew :macos:macosNativeImage"
          echo "  3. Run: ./freeman-native config.yaml (no -Djava.library.path needed)"