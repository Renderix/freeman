name: Build Freeman macOS Native JAR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@6d5d4c1c26335fbfba38c70d3600ef96e9793316
        with:
          gradle-home: gradle

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.kt', '**/*.kts') }}
          restore-keys: gradle-

      - name: Build KMP JVM fat JAR
        run: ./gradlew :macos:macosJar 2>&1 | tail -10

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: freeman-macos-jar
          path: macos/build/libs/macos-macos.jar

      - name: Build status summary
        if: always()
        run: |
          echo "=== Build complete ==="
          echo "JAR artifact: macos/build/libs/macos-macos.jar (uploaded as freeman-macos-jar)"
          echo ""
          echo "To build native binary locally:"
          echo "  1. Install GraalVM CE: https://www.graalvm.org/downloads/"
          echo "  2. Run: ./gradlew :macos:macosNativeImage"
          echo "  3. Binary: macos/build/native/.../freeman"
          echo ""
          echo "Then run: ./freeman-native config.yaml"
          echo "(No -Djava.library.path needed — native bundles ONNX Runtime)"